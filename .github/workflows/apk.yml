name: Compilation APK Quest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparation
        run: bash outils/preparer.sh

      - name: Export
        run: bash outils/exporter.sh

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: mandala-vr-apk
          path: build/mandala_vr.apk

      - name: Publication
        run: bash outils/publier.sh
        env:
          GH_TOKEN: ${{ github.token }}
